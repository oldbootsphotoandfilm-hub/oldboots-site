    (aberto ? '<p class="sub" style="margin-top:8px">' + X('ateDia') + ' ' + E(dt(S.fecha)) + '.</p>' : '<p class="sub" style="margin-top:8px">' + X('fechado') + '</p>') +
    '<div class="acts">' + (aberto ? '<button class="b1" data-a="edit">' + (S.alterado ? X('continuar') : X('editar')) + '</button>' : '') + (env ? '<button class="b2" data-a="pdf">' + X('pdf') + '</button>' : '') + '<a class="b2" href="' + WHATS + '" target="_blank" rel="noopener">' + X('mudar') + '</a></div>' +
    PASSOS.map(function (p, i) { var l = CAMPOS.filter(function (c) { return c.p === i && visivel(c) && !vazio(valor(c)); }); return l.length ? '<section><p class="lb">' + E(T(p.t)) + '</p><dl>' + l.map(function (c) { return '<dt>' + E(T(c.l)) + '</dt><dd>' + E(valor(c)) + '</dd>'; }).join('') + '</dl></section>' : ''; }).join('') + '</div>';
}

/* ---------- interação ---------- */
function marca(k, on) { var f = R.querySelector('[data-f="' + k + '"]'); if (f) f.classList.toggle('err', on); }
function mostraSe() { CAMPOS.forEach(function (c) { if (c.se) { var f = R.querySelector('[data-f="' + c.k + '"]'); if (f) f.hidden = !visivel(c); } }); }
A.addEventListener('input', function (e) {
  var t = e.target, k = t.dataset.k;
  if (k) {
    if (t.type === 'radio') return; // tratado no «change»
    if (t.type === 'checkbox' && t.name) S.v[k] = $$('input[name="obq_' + k + '"]:checked').map(function (i) { return i.value; });
    else if (t.type === 'checkbox') S.v[k] = t.checked;
    else S.v[k] = t.value;
    marca(k, false); mostraSe(); mudou(k); return;
  }
  if (t.dataset.pn != null) { S.v.pessoas[+t.dataset.pn].n = t.value; mudou('pessoas'); }
});
A.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.k && t.type === 'radio' && S.v[t.dataset.k] !== t.value) { S.v[t.dataset.k] = t.value; marca(t.dataset.k, false); mostraSe(); mudou(t.dataset.k); }
  else if (t.dataset.pr != null) { S.v.pessoas[+t.dataset.pr].r = t.value; mudou('pessoas'); }
  else if (t.dataset.pe != null) { S.v.pessoas[+t.dataset.pe].e = t.checked ? 1 : 0; mudou('pessoas'); }
  else if (t.dataset.fk) ficheiros(t);
  else if (t.dataset.pf != null) fotoPessoa(t);
});
A.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return; var a = b.dataset.a;
  if (a === 'seg') { var f = faltam(P); if (f.length) { f.forEach(function (c) { marca(c.k, true); }); R.querySelector('[data-f="' + f[0].k + '"]').scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast(X('falta'), 1); } P++; guardaLocal(); flush().catch(function () { }); render(); }
  else if (a === 'ant') { P--; guardaLocal(); render(); }
  else if (a === 'env') pedeEnvio();
  else if (a === 'edit') { MODO = 'editar'; P = 0; render(); }
  else if (a === 'casa') { flush().catch(function () { }); MODO = 'casa'; render(); }
  else if (a === 'quest') abrirQ();
  else if (a === 'ir') { var el = document.getElementById(b.dataset.v); if (el) R.scrollTo({ top: el.offsetTop - ($('.snav') ? $('.snav').offsetHeight : 0) + 1, behavior: 'smooth' }); }
  else if (a === 'doc') baixar(b, 'q_doc', [COD, b.dataset.v]);
  else if (a === 'ler') { MODO = 'ler'; flush().catch(function () { }); render(); }
  else if (a === 'pdf') baixar(b, 'q_pdf', [COD]);
  else if (a === 'addp') { S.v.pessoas = S.v.pessoas || []; if (S.v.pessoas.length >= 30) return toast(X('max30'), 1); S.v.pessoas.push({ n: '', r: 'outro', f: '', e: 0 }); redesenhaPes(); mudou('pessoas'); var l = $$('[data-pn]'); l[l.length - 1].focus(); }
  else if (b.dataset.px != null) { S.v.pessoas.splice(+b.dataset.px, 1); redesenhaPes(); mudou('pessoas'); }
  else if (b.dataset.fx) { S.v[b.dataset.fx].splice(+b.dataset.i, 1); mudou(b.dataset.fx); R.querySelector('[data-fl="' + b.dataset.fx + '"]').innerHTML = listaF(b.dataset.fx); }
  else if (b.dataset.ir != null) { P = +b.dataset.ir; guardaLocal(); render(); }
});
$$('.lg button').forEach(function (b) { b.onclick = function () { L = b.dataset.lang; ls.set('ob_q_lang', L); render(); }; });

// ficheiros: as imagens são reduzidas no aparelho (rápido mesmo com dados móveis); cada ficheiro vai logo para o servidor
function lerURL(file, cb) { var r = new FileReader(); r.onload = function () { cb(r.result); }; r.onerror = function () { cb(''); }; r.readAsDataURL(file); }
function reduz(file, max, cb) {
  lerURL(file, function (u) { if (!u) return cb('');
    var im = new Image(); im.onload = function () { var k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .85)); };
    im.onerror = function () { cb(''); }; im.src = u; });
}
function sobe(campo, nome, file, max, cb) {
  var img = /^image\//.test(file.type);
  aSubir++;
  var fim = function (r, url) { aSubir--; cb(r, url); };
  var envia = function (u) {
    if (!u) { toast('«' + file.name + '» ' + X('semEnvio'), 1); return fim(null); }
    if (img) nome = nome.replace(/\.(heic|heif|png|webp|gif|jpeg)$/i, '.jpg').replace(/^([^.]+)$/, '$1.jpg');
    api('q_ficheiro', [COD, campo, nome, u]).then(function (r) { if (img) THUMB[r.id] = u; fim(r, u); }, function (e) { toast('«' + file.name + '»: ' + (e.srv ? e.message : X('semRede')), 1); fim(null); });
  };
  if (img) reduz(file, max, envia); else lerURL(file, envia);
}
function ficheiros(inp) {
  var c = campoDe(inp.dataset.fk), l = S.v[c.k] = S.v[c.k] || [], fs = Array.prototype.slice.call(inp.files); inp.value = '';
  fs = fs.filter(function (f) { if (f.size > 10485760 && !/^image\//.test(f.type)) { toast('«' + f.name + '» ' + X('grande'), 1); return false; } return true; });
  var livres = c.max - l.length - (subindo[c.k] || 0); if (fs.length > livres) { toast(X('maxF'), 1); fs = fs.slice(0, Math.max(0, livres)); }
  var ul = function () { var u = R.querySelector('[data-fl="' + c.k + '"]'); if (u) u.innerHTML = listaF(c.k); };
  fs.forEach(function (f) {
    subindo[c.k] = (subindo[c.k] || 0) + 1; ul();
    sobe(c.k, f.name, f, 2000, function (r) { subindo[c.k]--; if (r) { l.push(r); mudou(c.k); } ul(); });
  });
}
function fotoPessoa(inp) {
  var f = inp.files[0], i = +inp.dataset.pf, p = S.v.pessoas[i]; inp.value = ''; if (!f) return;
  p._a = 1; redesenhaPes();
  sobe('pessoa', 'foto.jpg', f, 800, function (r) { delete p._a; if (r) { p.f = r.id; mudou('pessoas'); } redesenhaPes(); });
}

function pedeEnvio() {
  for (var i = 0; i < PASSOS.length; i++) { var f = faltam(i); if (f.length) { if (i !== P) { P = i; render(); } f.forEach(function (c) { marca(c.k, true); }); R.querySelector('[data-f="' + f[0].k + '"]').scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast(X('falta'), 1); } }
  if (aSubir) return toast(X('esperaF'), 1);
  var corr = S.envios > 0;
  $('#obqDt').textContent = corr ? X('dlgTc') : X('dlgT'); $('#obqDp').textContent = corr ? X('dlgPc') : X('dlgP');
  $('#obqNao').textContent = X('rever'); $('#obqSim').textContent = X('sim');
  $('#obqOv').classList.add('on'); $('#obqSim').focus();
}
$('#obqNao').onclick = function () { $('#obqOv').classList.remove('on'); };
$('#obqOv').addEventListener('click', function (e) { if (e.target.id === 'obqOv') $('#obqOv').classList.remove('on'); });
$('#obqSim').onclick = function () {
  var b = this; if (b.disabled) return; b.disabled = true; b.textContent = X('aEnviar');
  // primeiro grava tudo o que falta; só depois envia. Só mostra «enviado» quando o servidor confirmar.
  (Object.keys(PEND).length ? flush() : Promise.resolve()).then(function () { return api('q_enviar', [COD]); }).then(function (r) {
    S.envios = r.envios; S.enviado_em = r.em; S.alterado = false; MODO = 'ler'; $('#obqOv').classList.remove('on'); render();
  }, function (e) { toast(e.srv ? e.message : X('semRede'), 1); }).finally(function () { b.disabled = false; b.textContent = X('sim'); });
};
function baixar(b, fn, args) {
  b.disabled = true;
  api(fn, args).then(function (r) {
    var bin = atob(r.b64), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' })), a = document.createElement('a'); a.href = url; a.download = String(r.nome).normalize('NFD').replace(/[\u0300-\u036f]/g, ''); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }, function (e) { toast(e.srv ? e.message : X('semRede'), 1); }).finally(function () { b.disabled = false; });
}
function toast(t, e) { var x = $('#obqT'); x.textContent = t; x.className = 'toast on' + (e ? ' e' : ''); clearTimeout(toast.h); toast.h = setTimeout(function () { x.className = 'toast' + (e ? ' e' : ''); }, 3800); }

/* ---------- arranque ----------
   1.ª visita: ecrã de abertura enquanto o servidor responde.
   Visitas seguintes: mostra logo a última versão guardada neste aparelho (sem as respostas do questionário)
   e atualiza por trás quando o servidor responde. */
var CHC = 'ob_q_c_' + COD, splT0 = 0, querQ = false;
function splash(on) {
  var sp = $('#obqSpl'); if (!sp) return;
  if (on) { splT0 = Date.now(); $('#obqSplT').textContent = L === 'en' ? 'your page' : 'a vossa página'; sp.classList.remove('out'); return; }
  setTimeout(function () { sp.classList.add('out'); }, Math.max(0, 900 - (Date.now() - splT0))); // pelo menos ~1 s: sem piscar
}
function guardaCache(r) { var c = {}; Object.keys(r).forEach(function (k) { if (k !== 'v') c[k] = r[k]; }); c.casal_v = r.v && r.v.casal || ''; c._t = Date.now(); ls.set(CHC, JSON.stringify(c)); }
function leCache() { try { var c = JSON.parse(ls.get(CHC) || 'null'); return c && c._t && Date.now() - c._t < 30 * 864e5 ? c : null; } catch (e) { return null; } }
function aplicar(r) {
  var emForm = S && MODO !== 'casa' && !S._cache;
  if (emForm) { ['estado', 'abre', 'fecha', 'envios', 'enviado_em', 'alterado', 'info', 'data', 'casal'].forEach(function (k) { S[k] = r[k]; }); S.info = r.info || {}; return; }
  S = r; S.v = r.v || {}; S.info = r.info || {}; MODO = 'casa';
  // alterações que ficaram neste aparelho sem chegar ao servidor (ex.: sem rede): repõe e volta a gravar
  var loc = null; try { loc = JSON.parse(ls.get(CH) || 'null'); } catch (e) { }
  if (loc && loc.pend && S.estado === 'aberto') { PEND = loc.pend; Object.keys(PEND).forEach(function (k) { S.v[k] = PEND[k]; }); if (typeof loc.p === 'number') P = Math.min(Math.max(loc.p, 0), PASSOS.length - 1); }
  if (!S.v.pessoas || !S.v.pessoas.length) S.v.pessoas = [{ n: '', r: 'mae', f: '', e: 0 }, { n: '', r: 'pai', f: '', e: 0 }];
}
function abrir() {
  if (!/^q[a-f0-9]{40}$/.test(COD)) { splash(false); A.innerHTML = '<div class="ld w"><p>' + X('linkMau') + '</p></div>'; render(); return; }
  CHC = 'ob_q_c_' + COD;
  var c = leCache(), sc = 0;
  if (c) { sc = R.scrollTop; S = c; S.v = { casal: c.casal_v }; S.info = c.info || {}; S._cache = true; MODO = 'casa'; if (!IR_Q) render(); splash(false); }
  else splash(true);
  if (IR_Q) { IR_Q = false; querQ = true; }
  api('q_ler', [COD]).then(function (r) {
    guardaCache(r);
    var eraCache = S && S._cache, top = R.scrollTop;
    aplicar(r);
    if (querQ) { querQ = false; MODO = 'casa'; abrirQ(); }
    else if (MODO === 'casa') { render(); if (eraCache) R.scrollTop = top; } // mantém o sítio onde a pessoa estava
    splash(false);
    if (Object.keys(PEND).length) flush().catch(function () { });
  }, function (e) {
    splash(false);
    if (S && S._cache && !e.srv) { if (querQ) { querQ = false; render(); } return toast(X('semRede'), 1); } // sem rede: fica a versão guardada
    A.innerHTML = '<div class="ld w"><p>' + E(e.srv ? e.message : X('erroLer')) + '</p>' + (e.srv ? '' : '<p style="margin-top:16px"><button class="b2" id="obqRe">' + X('tentar') + '</button></p>') + '</div>';
    var re = $('#obqRe'); if (re) re.onclick = abrir;
  });
}
window.addEventListener('hashchange', function () { var h = lerHash(); if (h.cod === COD && S) { if (h.q) abrirQ(); return; } COD = h.cod; IR_Q = h.q; CH = 'ob_q_' + COD; PEND = {}; S = null; P = 0; abrir(); });
render(); abrir();
})();
</script>
