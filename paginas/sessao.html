<style>
/* ===== Old Boots · landing pages das sessões esporádicas (ex.: Natal em família) =====
   Os textos e imagens são widgets normais do Elementor (editáveis lá); este ficheiro só dá o estilo
   (o mesmo das propostas: textura oliva, papel, Chonburi + Luxurious Script) e o formulário de marcação. */
:root{--ob-ol:#454205;--ob-cr:#fff4cf;--ob-dk:#2b2a07;--ob-rd:#8a3b2e;--ob-mt:#6b6548;

.ob-ln :where(.elementor-element){margin:0!important;--widgets-spacing:0px}
.ob-ln .elementor-widget-container{margin:0!important;padding:0!important}
.ob-ln-ol{background:var(--ob-ol) var(--ob-olive) center/cover!important;color:var(--ob-cr)}

</style>
