/* ---------- PDF: abre a proposta escondida, fotografa as páginas e guarda ---------- */
function gerarPdf(p) {
  return new Promise(function (ok, no) {
    var old = document.getElementById('pdfframe'); if (old) old.parentNode.removeChild(old);
    var f = document.createElement('iframe'); f.id = 'pdfframe'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
    var fim = setTimeout(function () { limpar(); no(erro('O PDF demorou demasiado. Tente "Gerar PDF" outra vez.')); }, 120000);
    function limpar() { clearTimeout(fim); window.removeEventListener('message', ouvir); if (f.parentNode) f.parentNode.removeChild(f); }
    function ouvir(ev) {
      if (ev.origin !== location.origin || !ev.data || ev.data.tipo !== 'ob-pdf' || ev.data.codigo !== p.codigo) return;
      limpar(); if (ev.data.erro) return no(erro('Não foi possível gerar o PDF: ' + ev.data.erro)); ok(ev.data.data);
    }
    window.addEventListener('message', ouvir);
    f.src = linkDe(p).replace('#', '?pdf=1#'); R.appendChild(f);
  }).then(function (uri) {
    if (!/iPhone|iPad|iPod/.test(navigator.userAgent || '') && !(navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent || ''))) { var a = document.createElement('a'); a.href = uri; a.download = 'Proposta ' + p.id + ' - ' + p.casal.replace(/[\\/:*?"<>|]/g, '') + '.pdf'; R.appendChild(a); a.click(); a.remove(); }
    return rpc('pdf', p.id, uri);
  });
}

    if (mau) return toast('Valor inválido em: ' + mau.replace('Tabela ', ''), 1);

    }, function (e) { if (!e.auth) toast(e.message, 1); var b2 = $('[data-a=savetab]'); if (b2) { b2.disabled = false; b2.textContent = 'Guardar tabela de ' + ano; } }).finally(function () { busy(0); });
  },
