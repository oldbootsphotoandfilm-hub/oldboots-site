  Promise.all([lib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'), lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'), imagens(), pronto()])
    .then(function () {
      var secs = Array.prototype.filter.call(document.querySelectorAll('.ob-sl'), function (s) { return s.offsetParent !== null; });
      var doc = new window.jspdf.jsPDF({ unit: 'pt', format: [810, 1012.5], compress: true }), i = 0;
      var proxima = function () {
        if (i >= secs.length) { avisar({ data: doc.output('datauristring') }); return; }
        var s = secs[i];
        return window.html2canvas(s, { scale: 1080 / s.offsetWidth, useCORS: true, backgroundColor: null, logging: false }).then(function (c) {
          if (i > 0) doc.addPage([810, 1012.5]);
          doc.addImage(c.toDataURL('image/jpeg', .84), 'JPEG', 0, 0, 810, 1012.5, undefined, 'FAST');
          i++; return proxima();
        });
      };
      return proxima();
    }).catch(function (e) { avisar({ erro: String(e && e.message || e) }); });
}

if (!/^[A-Za-z0-9]{20,40}$/.test(COD)) { msg(L.falta); return; }
var ctrl = new AbortController(), tempo = setTimeout(function () { ctrl.abort(); }, 25000);
fetch(ENDPOINT, { method: 'POST', body: JSON.stringify({ fn: 'ver', a: [COD, PREVIA] }), signal: ctrl.signal, credentials: 'omit' })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    clearTimeout(tempo);
    if (!j || !j.ok) throw new Error((j && j.e) || 'erro');
    aplicar(j.r);
    return pronto().then(function () {
      B.classList.remove('ob-carregando'); if (load.parentNode) load.parentNode.removeChild(load);
      if (PDF) gerarPDF();
    });
  })
  .catch(function () { clearTimeout(tempo); msg(L.nao); if (PDF) try { parent.postMessage({ tipo: 'ob-pdf', codigo: COD, erro: 'A proposta não abriu.' }, location.origin); } catch (e) { } });
})();
